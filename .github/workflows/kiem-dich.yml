# Kiểm đa ngôn ngữ frontend: chữ tiếng Việt chưa bọc t(), khóa t() thiếu bản dịch tiếng Anh, một khóa hai bản dịch.
# Quy ước viết: AGENTS.md (mục "Đa ngôn ngữ"). Chạy trên máy: cd frontend && npm run i18n:kiem
name: Kiểm đa ngôn ngữ

on:
  push:
    paths:
      - "frontend/src/**"
      - "frontend/scripts/i18n/**"
      - ".github/workflows/kiem-dich.yml"
  pull_request:
    branches: [Dev, main]
    paths:
      - "frontend/src/**"
      - "frontend/scripts/i18n/**"
      - ".github/workflows/kiem-dich.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-dich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Kiểm bản dịch
        run: npm run i18n:kiem -- --chi-tiet
