server {
    listen 80;
    server_name _;
    # Không lộ phiên bản nginx ở header Server và trang lỗi
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # CSP chế độ THEO DÕI (Report-Only): trình duyệt không chặn gì, chỉ gửi báo cáo vi phạm về /api/v1/bao-cao-csp
    # (máy chủ ghi log "CSP (theo dõi)"). Theo dõi 1–2 tuần, thêm nguồn hợp lệ còn thiếu, rồi đổi tên header bên dưới
    # thành Content-Security-Policy để chặn thật.
    # style-src cần 'unsafe-inline': MUI / Emotion và biểu đồ chèn thẻ <style> lúc chạy.
    # connect-src ghi rõ wss://$host cho WebSocket /ws-pos, /ws-outbound: Safari cũ không coi 'self' là gồm wss:.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://minio.slmglobal.vn https://images.unsplash.com https://images.pexels.com; media-src 'self' blob: https://minio.slmglobal.vn; connect-src 'self' wss://$host https://minio.slmglobal.vn; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/bao-cao-csp";

    # Lưu ý: add_header trong một location thay toàn bộ add_header của mức server, nên bộ header bảo mật được lặp ở
    # từng location trả trang tĩnh. /api không thêm: Spring Security của máy chủ đã gửi các header này.

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only $csp always;
    }

    # index.html (kể cả khi try_files trả về cho đường dẫn của trang): không cache, bản triển khai mới có hiệu lực ngay
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only $csp always;
    }

    # API proxy to backend
    location /api {
        proxy_pass http://backend_fs:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
