#File storage config
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=600MB
spring.servlet.multipart.enabled=true
server.max-http-request-header-size=128KB
# Gate checkout POS: BẬT cho dev. Production TẮT qua application-prod.properties
# (profile prod) và production/Fashion-Management/application.properties.
# Tắt nhanh khi cần: đặt biến môi trường POS_CHECKOUT_ENABLED=false
pos.checkout-enabled=${POS_CHECKOUT_ENABLED:true}

# ===== Thanh toán payOS =====
# Khóa dùng để MÃ HÓA Client ID / API Key / Checksum Key trước khi lưu DB.
# Dev dùng chung giá trị mặc định dưới đây (cả nhóm đọc được cùng DB dev).
# Production BẮT BUỘC đặt biến môi trường PAYMENT_CONFIG_SECRET riêng, bí mật.
payment.config.secret=${PAYMENT_CONFIG_SECRET:fcentric-dev-only-payment-secret-do-not-use-in-prod}
payos.api-base-url=${PAYOS_API_BASE_URL:https://api-merchant.payos.vn}
# Địa chỉ frontend (returnUrl/cancelUrl của payOS) và địa chỉ backend công khai (gợi ý webhook URL, vd. link ngrok)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-public-url=${APP_BACKEND_PUBLIC_URL:}

# ===== Casso (đối soát giao dịch ngân hàng) =====
# API key KHÔNG để trong mã nguồn/repo. Đặt biến môi trường CASSO_API_KEY trước khi chạy backend.
# Thiếu key -> chức năng kiểm tra thanh toán đơn mua hàng báo lỗi "Chưa cấu hình API key Casso".
casso.api-key=${CASSO_API_KEY:}
