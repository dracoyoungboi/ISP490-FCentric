chungTuKho.chiSuaLoPhieuBanChuaXuat=Chỉ được sửa lô cho phiếu bán hàng chưa xuất kho (Nháp hoặc Chờ xuất)
chungTuKho.chiQlKhoSuaLoPhieuBan=Lô của phiếu xuất bán hàng lấy từ phiếu nhặt. Chỉ quản lý kho hoặc quản trị viên được sửa lô.
chungTuKho.khongPickLoTrenPhieuYeuCau=Không được pick lô trực tiếp trên phiếu yêu cầu. Vui lòng tạo Phiếu Xuất.
chungTuKho.dongPhieuXuatGocKhongTimThay=Không tìm thấy dòng phiếu xuất gốc
chungTuKho.pickLoTuDongGoc=Vui lòng thực hiện pick lô từ dòng sản phẩm gốc
chungTuKho.dongSanPhamKhongThuocPhieuXuat=Dòng sản phẩm không thuộc phiếu xuất này
chungTuKho.thieuDanhSachLo=Thiếu danh sách lô
chungTuKho.tongPickLoVuotYeuCau=Tổng số lượng bốc lô vượt quá số lượng yêu cầu
chungTuKho.suaLoPhaiDuSoLuong=Sửa lô phải đủ số lượng của dòng [{0}]: tổng {1}, cần {2} (không đổi số lượng phiếu)
chungTuKho.moiLoChonMotLan=Mỗi lô chỉ được chọn một lần
chungTuKho.loHangKhongTimThayChung=Không tìm thấy lô hàng
chungTuKho.loKhongCuaSanPham=Lô {0} không phải lô của sản phẩm [{1}]
chungTuKho.sanPhamKhongTonTrongLo=Sản phẩm không có tồn kho trong lô đã chọn tại kho này
chungTuKho.loChiConCoTheLay=Lô {0} chỉ còn {1} có thể lấy (phần còn lại đang được phiếu khác giữ)
chungTuKho.sanPhamChuaPickDu=Sản phẩm {0} chưa được pick đủ số lượng
chungTuKho.phieuXuatKhongTimThay=Không tìm thấy phiếu xuất
chungTuKho.khongCoQuyenXemPhieu=Không có quyền xem phiếu này
chungTuKho.chiTietKhongTimThay=Không tìm thấy chi tiết
chungTuKho.dongChiTietKhongThuocPhieuXuat=Dòng chi tiết không thuộc phiếu xuất này
chungTuKho.maQuetTrong=Mã barcode hoặc số phiếu xuất / đơn hàng không được để trống
chungTuKho.donHangDaHuyKhongDongGoi=ĐƠN HÀNG {0} ĐÃ BỊ HỦY! Không có phiếu xuất kho để đóng gói.
chungTuKho.donHangChuaCoPhieuXuat=Đơn hàng {0} chưa được tạo phiếu xuất kho
chungTuKho.khongTimThayTheoMaQuet=Không tìm thấy phiếu xuất kho hoặc đơn hàng khớp với mã [{0}]
chungTuKho.donHuyKhoaDongGoi=ĐƠN HÀNG ĐÃ BỊ HỦY! Hệ thống đã khóa đóng gói. Vui lòng chuyển toàn bộ hàng của đơn này vào Thùng gom hàng hoàn kệ (Return-to-stock) tại bàn đóng gói.
