# Thông báo kiểm kê khoanh vùng (ThongBaoKiemKeService). Câu LƯU XUỐNG bảng thong_bao (tiếng Việt), dịch lúc đọc bằng
# DichThongBao: mỗi câu là một khóa, các câu nối nhau bằng một khoảng trắng. UTF-8, MessageFormat: {0}; nháy đơn viết đôi ''.

# --- Đợt chờ duyệt ---
thongBaoKiemKe.choDuyetTieuDe=Đợt kiểm kê {0} chờ duyệt
thongBaoKiemKe.choDuyetKhop={0}: khớp toàn bộ.
thongBaoKiemKe.choDuyetLechThua={0}: lệch {1} dòng (thừa {2} sản phẩm).
thongBaoKiemKe.choDuyetLechThieu={0}: lệch {1} dòng (thiếu {2} sản phẩm).
thongBaoKiemKe.choDuyetLechCaHai={0}: lệch {1} dòng (thừa {2}, thiếu {3} sản phẩm).
thongBaoKiemKe.choDuyetLechKhongSo={0}: lệch {1} dòng ( sản phẩm).
thongBaoKiemKe.khoaVanGiu=Khóa kiểm kê vẫn giữ tới khi duyệt.

# --- Đợt nháp chờ người chủ trì bắt đầu ---
thongBaoKiemKe.choBatDauTieuDe=Đợt kiểm kê {0} chờ bạn bắt đầu
thongBaoKiemKe.daLapDotNhap={0} đã lập đợt nháp và chọn bạn chủ trì.
thongBaoKiemKe.xemLaiPhamVi=Xem lại phạm vi rồi bấm Bắt đầu kiểm kê.
thongBaoKiemKe.nguoiLap=Người lập

# --- Yêu cầu đếm lại ---
thongBaoKiemKe.demLaiTieuDe=Đợt kiểm kê {0} cần đếm lại {1} dòng
thongBaoKiemKe.lyDo=Lý do: {0}

# --- Đã duyệt ---
thongBaoKiemKe.daDuyetTieuDe=Đợt kiểm kê {0} đã được duyệt
thongBaoKiemKe.duyetKhop=Khớp toàn bộ, không điều chỉnh tồn.
thongBaoKiemKe.duyetDaDieuChinh=Tồn kho đã điều chỉnh theo phiếu {0}.
thongBaoKiemKe.khoaDaMo=Khóa kiểm kê đã mở.

# --- Đợt bắt đầu / kết thúc (người kho và người bán của kho) ---
thongBaoKiemKe.batDauTieuDe={0} bắt đầu kiểm kê (đợt {1})
thongBaoKiemKe.batDauToanKho=Kiểm toàn bộ kho: tạm dừng bán tại quầy, nhặt, xuất, nhập và chuyển hàng của kho tới khi đợt được duyệt hoặc hủy.
thongBaoKiemKe.batDauPhamVi=Hàng trong phạm vi đợt tạm dừng bán, nhặt và xuất tới khi đợt được duyệt hoặc hủy. Hàng ngoài phạm vi vẫn bán bình thường.
thongBaoKiemKe.ketThucDuyetTieuDe={0} đã kết thúc kiểm kê (đợt {1})
thongBaoKiemKe.ketThucHuyTieuDe={0}: đợt kiểm kê {1} đã hủy
thongBaoKiemKe.hangBanLai=Hàng trong phạm vi đợt đã bán và xuất lại bình thường.
