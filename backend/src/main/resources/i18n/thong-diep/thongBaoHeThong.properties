# Thông báo hệ thống (ThongBaoHeThongService): kết nối kênh bán, đẩy tồn, quyền người dùng, đổi thông tin nhạy cảm.
# Câu LƯU XUỐNG bảng thong_bao (tiếng Việt), dịch lúc đọc bằng DichThongBao: mỗi câu (kết thúc bằng dấu chấm) là một khóa,
# các câu nối nhau bằng một khoảng trắng. Câu sinh ra phải giống hệt câu cũ. UTF-8, MessageFormat: {0}; nháy đơn viết đôi ''.

