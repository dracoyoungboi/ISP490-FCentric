# Câu thông báo trả hàng tại quầy POS (đặc tả BA "Trả hàng / Đổi hàng tại POS"). UTF-8, MessageFormat: {0}; nháy đơn viết ''.

# --- MSG-RET-01..04 (nguyên văn đặc tả BA) ---
traHang.khongTimThayDon=Không tìm thấy thông tin đơn hàng hợp lệ. Vui lòng kiểm tra lại mã hóa đơn!
traHang.quaHanCanDuyet=Đơn hàng đã vượt quá thời hạn đổi trả theo quy định (Quá 03 ngày). Thao tác yêu cầu phê duyệt của Quản lý cửa hàng.
traHang.vuotSoLuongConTra=Số lượng trả không thể vượt quá số lượng khách đã mua trừ đi lượng đã trả! ({0} chỉ còn trả được {1})
traHang.daTraHang=Hoàn tất thủ tục trả hàng thành công. Mã phiếu: {0}. Hệ thống đang in biên lai

# --- Kiểm đầu vào ---
traHang.thieuMaYeuCau=Thiếu mã yêu cầu trả hàng. Tải lại màn hình rồi thử lại.
traHang.thieuDonGoc=Chọn hóa đơn gốc trước khi trả hàng.
traHang.chonCachHoanTien=Chọn cách hoàn tiền: tiền mặt hoặc chuyển khoản.
traHang.thieuThongTinChuyenKhoan=Nhập đủ ngân hàng, số tài khoản, tên chủ tài khoản và mã giao dịch chuyển khoản.
traHang.soTaiKhoanKhongHopLe=Số tài khoản chỉ gồm chữ số, từ 6 đến 20 số.
traHang.chuaChonSanPham=Chọn ít nhất một sản phẩm khách trả.
traHang.dongKhongHopLe=Danh sách sản phẩm trả có dòng trống hoặc lặp. Tải lại đơn rồi chọn lại.
traHang.dongKhongThuocDon=Sản phẩm trả không thuộc hóa đơn gốc. Tải lại đơn rồi chọn lại.
traHang.soLuongTraKhongHopLe=Số lượng trả phải là số nguyên lớn hơn 0.
traHang.chonHienTrang=Chọn hiện trạng của từng sản phẩm trả: Đạt hoặc Lỗi.
traHang.chonLyDo=Chọn lý do trả hàng cho từng sản phẩm.
traHang.chonNhomLoi=Chọn nhóm lỗi cho sản phẩm hàng lỗi.
traHang.chonKeChoHangDat=Chọn kệ cất hàng cho {0} (hàng Đạt).
traHang.keKhongThuocCuaHang=Kệ đã chọn không thuộc cửa hàng nhận trả hoặc đang ngừng dùng. Chọn kệ khác.
traHang.khongTimThayLoDaBan=Không tìm thấy lô đã bán của {0} trên phiếu xuất của đơn gốc. Báo quản lý kiểm tra phiếu xuất.
traHang.maYeuCauDaDung=Mã yêu cầu này đã dùng cho một hóa đơn khác. Tải lại màn hình rồi thử lại.

# --- Duyệt quá hạn (GBR-RET-02) ---
traHang.duyetKhongConHieuLuc=Phê duyệt của quản lý đã hết hiệu lực hoặc đã dùng. Yêu cầu quản lý duyệt lại.
traHang.conHanKhongCanDuyet=Đơn còn trong hạn đổi trả 03 ngày, không cần quản lý duyệt.
traHang.nhapLyDoDuyet=Chọn hoặc nhập lý do xin duyệt ngoại lệ.
traHang.choGuiLaiMa=Mã vừa được gửi. Đợi {0} giây rồi gửi lại.
traHang.chuaCoQuanLyNhanMa=Cửa hàng chưa có quản lý có email để nhận mã duyệt. Nhờ quản trị viên phân quyền quản lý cho cửa hàng.
traHang.khongGuiDuocMaDuyet=Chưa gửi được email mã duyệt. Thử lại sau ít phút.
traHang.daGuiMaDuyet=Đã gửi mã duyệt tới email quản lý
traHang.maDuyetSauSo=Mã duyệt gồm 6 chữ số.
traHang.yeuCauDuyetKhongTonTai=Không tìm thấy yêu cầu duyệt. Gửi lại yêu cầu cho quản lý.
traHang.yeuCauDuyetDaDong=Yêu cầu duyệt này đã đóng. Gửi lại yêu cầu cho quản lý.
traHang.maDuyetHetHan=Mã duyệt đã hết hạn. Gửi lại yêu cầu để nhận mã mới.
traHang.maDuyetSai=Mã duyệt không đúng. Còn {0} lần thử.
traHang.maDuyetSaiHetLuot=Nhập sai mã quá 5 lần. Gửi lại yêu cầu để nhận mã mới.
traHang.quaNhieuYeuCauDuyet=Đơn này đã xin duyệt quá 5 lần trong 24 giờ. Liên hệ trực tiếp quản lý cửa hàng.
traHang.daDuyet=Quản lý đã duyệt trả hàng quá hạn

# --- Biên bản ---
traHang.phieuKhongTonTai=Không tìm thấy phiếu trả hàng.
traHang.khongCoQuyenXemPhieu=Bạn không phụ trách cửa hàng của phiếu trả hàng này.
