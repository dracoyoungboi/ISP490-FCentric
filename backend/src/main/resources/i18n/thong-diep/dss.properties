dss.tyLeTangTruongKhongHopLe=Tỷ lệ tăng trưởng dự phóng phải từ -80% đến 300%
dss.soNgayDemHoacConLaiKhongHopLe=Số ngày đệm hoặc số ngày còn lại phải từ 1 đến 90 ngày
dss.leadTimeMacDinhKhongHopLe=Lead Time mặc định phải từ 1 đến 90 ngày
dss.soMauLeadTimeKhongHopLe=Số đơn mẫu tính Lead Time phải từ 1 đến 50 đơn
dss.chuaCoKhoTong=Chưa có Kho tổng đang hoạt động để tính gợi ý nhập hàng
