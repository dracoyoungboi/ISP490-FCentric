dss.khongQuyenSuaCauHinh=Chỉ Quản trị viên hoặc Quản lý kho mới được thay đổi tham số gợi ý nhập hàng
dss.duLieuKhuyenNghiRong=Danh sách khuyến nghị cần áp dụng không được để trống
dss.khoangThoiGianKhongHopLe=Khoảng thời gian thống kê hỗ trợ 1h, 24h hoặc 7d
dss.daCapNhatCauHinhVaTinhLai=Đã lưu tham số và tính lại ngưỡng cảnh báo tồn thấp
dss.daApDungKhuyenNghiDongBo=Đã áp dụng cấu hình giữ tồn an toàn và ngưỡng đồng bộ tức thời cho {0} liên kết

