thongBaoThanhToan.daNhanTienOKhoThuNgan=Đã nhận tiền ở {0} (thu ngân {1}).
thongBaoThanhToan.traLaiTienChoKhach=Trả lại tiền cho khách ở Đối soát chuyển khoản.
thongBaoThanhToan.banChoKhachHoacTraTien=Bán cho khách hoặc trả lại tiền ở Đối soát chuyển khoản.
thongBaoThanhToan.donHuySauThuTien=Đơn đã hủy sau khi thu tiền.
thongBaoThanhToan.khachTraHangSauThuTien=Khách trả hàng sau khi thu tiền.
thongBaoThanhToan.khachTraDu=Khách trả dư.
thongBaoThanhToan.traLaiKhachRoiGhiNhan=Trả lại khách rồi bấm Ghi nhận hoàn tiền.
thongBaoThanhToan.donCanHoanSoTien=Đơn {0} cần hoàn {1}
thongBaoThanhToan.donCanHoanTien=Đơn {0} cần hoàn tiền
thongBaoThanhToan.khongConPhieuChuaDoiChieu=Không còn phiếu chuyển khoản chưa đối chiếu
thongBaoThanhToan.phieuChuaDoiChieu={0} phiếu chuyển khoản chưa đối chiếu
thongBaoThanhToan.moiPhieuDaDoiChieu=Mọi phiếu đã đối chiếu với sao kê.
thongBaoThanhToan.doiChieuVoiSaoKe=Đối chiếu với sao kê ngân hàng ở Báo cáo doanh thu.
thongBaoThanhToan.quay=Quầy
