# Câu thông báo thanh toán (ThongBaoThanhToanService): lưu bằng tiếng Việt, dịch lúc đọc ở DichThongBao.
# Câu Việt sinh ra phải giống hệt câu mã nguồn ghi. UTF-8, MessageFormat: {0}; nháy đơn viết đôi ''.
thongBaoThanhToan.qrChuyenThieu=QR chuyển thiếu, chưa tạo được đơn
thongBaoThanhToan.qrChuyenDu=QR chuyển dư, chưa tạo được đơn
thongBaoThanhToan.qrTienVeMuon=Tiền QR về sau khi mã đã hủy
thongBaoThanhToan.qrDaNhanTien=Đã nhận tiền QR, chưa tạo được đơn
thongBaoThanhToan.daNhanTrenTong=Đã nhận {0} / {1} ở {2}.
thongBaoThanhToan.daNhanTrenTongThuNgan=Đã nhận {0} / {1} ở {2} (thu ngân {3}).
thongBaoThanhToan.daNhanSoTien=Đã nhận {0} ở {1}.
thongBaoThanhToan.daNhanSoTienThuNgan=Đã nhận {0} ở {1} (thu ngân {2}).
