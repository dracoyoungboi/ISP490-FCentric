# Profile prod (docker-compose đặt SPRING_PROFILES_ACTIVE=prod).
# Chỉ ghi đè những key cần khác dev; các key khác lấy từ application.properties.
# POS checkout BẬT ở production (tắt nhanh: biến môi trường POS_CHECKOUT_ENABLED=false).
pos.checkout-enabled=${POS_CHECKOUT_ENABLED:true}

# Khóa mã hóa cấu hình payOS: nên đặt biến môi trường PAYMENT_CONFIG_SECRET riêng;
# chưa đặt thì tạm dùng JWT signer key để vẫn lưu được khóa payOS ngay sau deploy.
payment.config.secret=${PAYMENT_CONFIG_SECRET:${constant.key.signer-key}}
app.frontend-url=${APP_FRONTEND_URL:https://fcentric.net}
app.backend-public-url=${APP_BACKEND_PUBLIC_URL:}
