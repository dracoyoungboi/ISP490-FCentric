# Profile prod (docker-compose đặt SPRING_PROFILES_ACTIVE=prod).
# Chỉ ghi đè những key cần khác dev; các key khác lấy từ application.properties.
# POS checkout TẮT ở production cho đến khi nghiệm thu.
pos.checkout-enabled=${POS_CHECKOUT_ENABLED:false}

# payOS ở production: khóa mã hóa CHỈ lấy từ biến môi trường (không có giá trị mặc định).
payment.config.secret=${PAYMENT_CONFIG_SECRET:}
app.frontend-url=${APP_FRONTEND_URL:https://fcentric.net}
app.backend-public-url=${APP_BACKEND_PUBLIC_URL:}
