spring.application.name=backend


# API Document
open.api.title=Fashion API
open.api.version=v1.0.0
open.api.description=Fashion API version 1.0.0

# Database Configuration
# connectionTimeZone: múi giờ máy chủ (Việt Nam, UTC+7 — không dùng giờ mùa hè) để driver đọc/ghi cột timestamp đúng giờ
# forceConnectionTimeZoneToSession: ép SET time_zone = '+07:00' mỗi phiên, không phụ thuộc cấu hình máy chủ MySQL
# (%2B = dấu "+"; dùng offset số để không cần bảng timezone của MySQL như khi dùng tên "Asia/Ho_Chi_Minh")
spring.datasource.url=jdbc:mysql://171.244.142.43:3306/fashion_system?connectionTimeZone=%2B07:00&forceConnectionTimeZoneToSession=true
spring.datasource.username=root
spring.datasource.password=slm123slm123

# JPA (Hibernate) Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Instant -> cột TIMESTAMP thường (đọc/ghi theo epoch, độc lập múi giờ JVM/MySQL),
# thay vì TIMESTAMP_UTC mặc định của Hibernate cho MySQL (diễn giải wall-clock theo UTC -> lệch +7h)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Jackson: đồng bộ múi giờ cho các trường java.util.Date (Instant luôn xuất UTC với hậu tố Z)
spring.jackson.time-zone=Asia/Ho_Chi_Minh

